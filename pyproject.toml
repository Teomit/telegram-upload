[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-upload"
description = "Upload (and download) files to Telegram up to 4 GiB using your account."
readme = "README.rst"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nekmo", email = "contacto@nekmo.com" },
]
keywords = ["telegram-upload", "telegram", "upload", "video"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "coverage",
    "bump-my-version",
    "tox>=4.0",
    "sphinx-click",
]

[project.urls]
Homepage = "https://github.com/Nekmo/telegram-upload/"
Source = "https://github.com/Nekmo/telegram-upload/"
Documentation = "https://docs.nekmo.org/telegram-upload/"

[project.scripts]
telegram-upload = "telegram_upload.management:upload_cli"
telegram-download = "telegram_upload.management:download_cli"

[tool.setuptools.packages.find]
include = ["telegram_upload*"]

[tool.setuptools.dynamic]
version = { attr = "telegram_upload.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (line-length handles obvious cases; long URLs/strings are ok)
    "B008",   # function call in argument default — click's pattern
    "SIM117", # nested with — sometimes clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "SIM"]    # tests can use bare excepts/asserts liberally

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
    "ignore::ResourceWarning",
]
# `test_caption_format` is a click.Command, not a test — pytest tries to collect
# it because of the `test_` prefix. The filterwarnings above silences the warning
# but the actual command is also flagged with __test__ = False in source.

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["telegram_upload"]
# pyrogram wraps async methods in sync stubs at import time (sync.py); mypy
# can't see that, so calling Client.send_document is reported as
# `unused-coroutine`. Disable that one check globally rather than scattering
# # type: ignore comments at every call site.
disable_error_code = ["unused-coroutine"]

[[tool.mypy.overrides]]
module = "telegram_upload._backend._pyrogram._backend"
# Pyrogram InputMedia* are siblings, not subclasses of a common Input type;
# mypy infers list[InputMediaVideo] from the first append and complains. The
# code is correct at runtime — pyrogram dispatches by isinstance.
disable_error_code = ["arg-type", "list-item"]

[tool.coverage.run]
source = ["telegram_upload"]
branch = true

[tool.bumpversion]
current_version = "0.7.1"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "telegram_upload/__init__.py"
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
